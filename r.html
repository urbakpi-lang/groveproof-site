(function(){
  var esc=GP.esc, t=GP.t, rep=null, id=new URLSearchParams(location.search).get("id")||"";
  GP.onWaking=function(){ var w=document.getElementById("waking"); if(w) w.textContent=t("waking"); };
  GP.onLang=function(){ GP.nav(); render(); };
  function n(v){ return v==null?"":v; }
  function render(){
    if(!rep) return; GP.applyI18n();
    var R=rep.results||[];
    document.getElementById("box").innerHTML =
      '<h1>'+esc(rep.title||t("h"))+'</h1><p class="faint">'+esc(t("created"))+' '+esc((rep.created_at||"").slice(0,10))+' · ID <span class="mono">'+esc(rep.id)+'</span></p>'+

      '<div class="card"><div class="map" id="rmap"></div><div class="scroll" style="margin-top:.8rem"><table class="t"><tr><th>'+esc(t("plot"))+'</th><th>'+esc(t("origin"))+'</th><th>'+esc(t("result"))+'</th><th>'+esc(t("forest"))+'</th><th>'+esc(t("loss"))+'</th></tr>'+
      R.map(function(r){ var w=(r.issues||[]).filter(function(i){return i&&i.level==="avviso";}).map(function(i){return '<li class="w">⚠ '+esc(i.msg)+'</li>';}).join("");
        return '<tr><td class="mono">'+esc(r.plot_id)+'<ul class="reasons">'+(r.reasons||[]).map(function(x){return '<li>'+esc(x)+'</li>';}).join("")+w+'</ul></td><td>'+esc(n(r.origine))+'</td><td>'+GP.vchip(r.verdict,r.confidence)+'</td><td>'+esc(n(r.forest_ha_2020))+'</td><td>'+esc(n(r.disturb_ha_post2020))+'</td></tr>'; }).join("")+
      '</table></div><p class="faint">'+esc(t("disc"))+'</p></div>'+
      '<div class="card"><h3>'+esc(t("cta_h"))+'</h3><p class="muted">'+esc(t("cta_p"))+'</p><a class="btn" href="app.html">'+esc(t("cta"))+'</a></div>';
    document.getElementById("cp").onclick=function(){ var b=this; try{ navigator.clipboard.writeText(location.href).then(function(){ b.textContent=t("copied"); }); }catch(e){} };
    GP.map("rmap").draw(R.map(function(r){ return {lat:r.lat,lng:r.lon,verdict:r.verdict,label:R.length<=30?r.plot_id:""}; }));
  }
  GP.nav(); GP.applyI18n();
  if(!/^[A-Za-z0-9_-]{6,64}$/.test(id)){ document.getElementById("box").innerHTML='<p class="muted">'+esc(t("notfound"))+'</p>'; return; }
  GP.api("/reports/"+encodeURIComponent(id)).then(function(d){ rep=d; if(!new URLSearchParams(location.search).get("lang") && !GP.store("gp_lang") && d.lang){ GP.lang=d.lang; GP.nav(); } render(); })
    .catch(function(){ document.getElementById("box").innerHTML='<p class="muted">'+esc(t("notfound"))+'</p>'; });
})();
