var durante 5 años sus datos y los números de referencia DDS; GroveProof lo facilita y añade un análisis satelital de los orígenes."], ["¿Cuándo se aplican las normas?", "Para los operadores grandes y medianos desde el 30 de diciembre de 2026; para las micro y pequeñas empresas desde el 30 de junio de 2027."], ["¿Puedo borrar mis datos?", "Sí, en cualquier momento desde la aplicación. Antes puede exportarlo todo."]], "contact_h": "Contacto", "contact_p": "¿Preguntas, sugerencias o un error en un resultado? Escríbanos y respondemos en dos días laborables. Para su situación jurídica concreta, consulte a un abogado o a su asociación sectorial.", "company": "Empresa", "msg": "Su mensaje", "send": "Enviar", "thanks": "Gracias, nos pondremos en contacto."}, "pl": {"h": "GroveProof jest bezpłatny", "p": "Bez abonamentu, bez danych płatniczych, bez płatnych planów. Korzystaj z weryfikacji satelitarnej i rejestru tyle, ile potrzebujesz, w poniższych limitach.", "inc_h": "Co obejmuje", "inc": ["Nieograniczone pojedyncze weryfikacje w bezpłatnym narzędziu na stronie głównej", "Konto z maksymalnie 25 działkami pochodzenia", "Rejestr partii i numerów referencyjnych DDS", "Eksport do Excel/CSV i PDF", "Opcjonalna publiczna strona pochodzenia z kodem QR na opakowania"], "note": "Jeśli kiedyś wprowadzimy płatne funkcje, ogłosimy to z wyprzedzeniem. Będą obowiązywać tylko za Twoją wyraźną zgodą; obecne funkcje pozostaną bezpłatne.", "start": "Załóż bezpłatne konto", "faq_h": "Pytania", "faq": [["Dlaczego jest bezpłatny?", "GroveProof to niezależny projekt. Nie sprzedajemy Twoich danych i nie ma reklam."], ["Czy potrzebuję GroveProof, aby spełnić wymogi EUDR?", "Żadne narzędzie samo w sobie nie zapewnia zgodności. MŚP na dalszych etapach łańcucha muszą przede wszystkim przechowywać przez 5 lat dane i numery referencyjne DDS; GroveProof to ułatwia i dodaje satelitarną analizę pochodzenia."], ["Od kiedy obowiązują przepisy?", "Dla dużych i średnich podmiotów od 30 grudnia 2026 r.; dla (function(){

  function render(){
    GP.applyI18n();
    document.getElementById("inc").innerHTML = t("inc").map(function(x){ return '<li>'+esc(x)+'</li>'; }).join("");
